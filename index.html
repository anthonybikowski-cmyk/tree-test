<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Wayfinder Tree Test</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
:root{
  --bg:#FAF8F3; --surface:#FFFFFF; --surface-2:#F0ECE2; --surface-3:#E7E1D2;
  --ink:#1D2420; --ink-dim:#5B655F; --ink-faint:#8A928B; --border:#DEDACB;
  --accent:#2F6F62; --accent-ink:#FFFFFF; --accent-soft:#E3EEE9; --accent-strong:#1F5145;
  --success:#3D8361; --success-soft:#E5F2E9;
  --warn:#B9803B; --warn-soft:#FAEEDD;
  --danger:#B5473F; --danger-soft:#FBEAE7;
  --focus:#2F6F62;
  --shadow: 0 1px 2px rgba(30,36,32,.06), 0 6px 20px -8px rgba(30,36,32,.15);
  --radius:12px;
  color-scheme: light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#14181A; --surface:#1C2123; --surface-2:#242B2C; --surface-3:#2C3334;
    --ink:#ECEEEA; --ink-dim:#A3ABA4; --ink-faint:#727B74; --border:#333B3B;
    --accent:#63AB98; --accent-ink:#0B1613; --accent-soft:#1E2E2A; --accent-strong:#8AC4B2;
    --success:#63B583; --success-soft:#182A20;
    --warn:#DDA362; --warn-soft:#2B2015;
    --danger:#DE7B72; --danger-soft:#2C1917;
    --shadow: 0 1px 2px rgba(0,0,0,.3), 0 8px 24px -8px rgba(0,0,0,.5);
  }
}
:root[data-theme="dark"]{
  --bg:#14181A; --surface:#1C2123; --surface-2:#242B2C; --surface-3:#2C3334;
  --ink:#ECEEEA; --ink-dim:#A3ABA4; --ink-faint:#727B74; --border:#333B3B;
  --accent:#63AB98; --accent-ink:#0B1613; --accent-soft:#1E2E2A; --accent-strong:#8AC4B2;
  --success:#63B583; --success-soft:#182A20;
  --warn:#DDA362; --warn-soft:#2B2015;
  --danger:#DE7B72; --danger-soft:#2C1917;
  --shadow: 0 1px 2px rgba(0,0,0,.3), 0 8px 24px -8px rgba(0,0,0,.5);
}
*{box-sizing:border-box;}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"IBM Plex Sans",system-ui,sans-serif;line-height:1.5;-webkit-font-smoothing:antialiased;}
h1,h2,h3{font-family:"Fraunces",Georgia,serif;font-weight:600;text-wrap:balance;margin:0 0 .3em;color:var(--ink);}
p{margin:0 0 1em;color:var(--ink-dim);}
.mono{font-family:"IBM Plex Mono",monospace;font-variant-numeric:tabular-nums;}
a{color:var(--accent-strong);}
button{font-family:inherit;}
::selection{background:var(--accent-soft);}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px;}

.shell{min-height:100vh;display:flex;flex-direction:column;}
.topbar{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:14px 24px;background:var(--surface);border-bottom:1px solid var(--border);position:sticky;top:0;z-index:20;}
.brand{display:flex;align-items:center;gap:10px;font-family:"Fraunces",serif;font-weight:600;font-size:1.05rem;}
.brand .mark{width:26px;height:26px;border-radius:7px;background:var(--accent);color:var(--accent-ink);display:flex;align-items:center;justify-content:center;font-family:"IBM Plex Mono";font-size:.8rem;font-weight:600;flex:none;}
.tabs{display:flex;gap:4px;background:var(--surface-2);padding:4px;border-radius:10px;}
.tab{border:none;background:none;padding:7px 14px;border-radius:7px;font-size:.85rem;font-weight:600;color:var(--ink-dim);cursor:pointer;}
.tab.active{background:var(--surface);color:var(--ink);box-shadow:var(--shadow);}
.tab:hover:not(.active){color:var(--ink);}

main{flex:1;width:100%;}
.wrap{max-width:720px;margin:0 auto;padding:40px 24px 80px;}
.wrap-wide{max-width:1080px;margin:0 auto;padding:40px 24px 80px;}

.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:24px;box-shadow:var(--shadow);}
.card + .card{margin-top:16px;}
.eyebrow{font-family:"IBM Plex Mono";font-size:.72rem;letter-spacing:.08em;text-transform:uppercase;color:var(--accent-strong);font-weight:600;margin-bottom:8px;display:block;}
.banner{display:flex;gap:12px;align-items:flex-start;background:var(--accent-soft);border:1px solid var(--border);border-radius:var(--radius);padding:14px 16px;margin-bottom:20px;font-size:.88rem;color:var(--ink);}
.banner strong{color:var(--accent-strong);}
.banner.warn{background:var(--warn-soft);}
.btn{display:inline-flex;align-items:center;gap:8px;justify-content:center;border:1px solid var(--border);background:var(--surface);color:var(--ink);padding:10px 16px;border-radius:9px;font-size:.88rem;font-weight:600;cursor:pointer;text-decoration:none;}
.btn:hover{border-color:var(--accent);}
.btn-primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);}
.btn-primary:hover{background:var(--accent-strong);border-color:var(--accent-strong);}
.btn-ghost{border-color:transparent;background:none;}
.btn-danger{color:var(--danger);}
.btn:disabled{opacity:.45;cursor:not-allowed;}
.btn-sm{padding:6px 11px;font-size:.78rem;}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center;}
.row.between{justify-content:space-between;}
.stack{display:flex;flex-direction:column;gap:10px;}
label{font-size:.8rem;font-weight:600;color:var(--ink-dim);display:block;margin-bottom:5px;}
input[type=text],input[type=password],input[type=email],textarea{width:100%;font:inherit;font-size:.92rem;padding:9px 11px;border:1px solid var(--border);border-radius:8px;background:var(--surface);color:var(--ink);}
textarea{resize:vertical;min-height:80px;font-family:"IBM Plex Mono";font-size:.8rem;}
.field{margin-bottom:14px;}
.hint{font-size:.78rem;color:var(--ink-faint);margin-top:4px;}

/* --- take-test flow --- */
.intro-hero{text-align:left;margin-bottom:28px;}
.intro-hero h1{font-size:2rem;}
.progress{display:flex;gap:6px;margin-bottom:18px;}
.progress .dot{height:6px;flex:1;border-radius:3px;background:var(--surface-3);}
.progress .dot.done{background:var(--accent);}
.progress .dot.current{background:var(--accent-soft);border:1px solid var(--accent);}
.task-label{font-size:.78rem;font-weight:700;letter-spacing:.03em;text-transform:uppercase;color:var(--ink-faint);margin-bottom:6px;}
.task-text{font-size:1.25rem;font-family:"Fraunces",serif;font-weight:600;margin-bottom:22px;text-wrap:balance;}
.crumbs{font-family:"IBM Plex Mono";font-size:.78rem;color:var(--ink-dim);background:var(--surface-2);border-radius:8px;padding:9px 12px;margin-bottom:16px;overflow-x:auto;white-space:nowrap;}
.crumbs b{color:var(--ink);}
.node-list{list-style:none;margin:0 0 18px;padding:0;display:flex;flex-direction:column;gap:8px;}
.node-btn{width:100%;text-align:left;display:flex;justify-content:space-between;align-items:center;gap:10px;background:var(--surface);border:1px solid var(--border);padding:13px 15px;border-radius:9px;cursor:pointer;font-size:.95rem;font-weight:500;color:var(--ink);}
.node-btn:hover{border-color:var(--accent);background:var(--accent-soft);}
.node-btn.selected{border-color:var(--accent-strong);background:var(--accent-soft);box-shadow:0 0 0 1px var(--accent-strong) inset;}
.node-btn .chev{color:var(--ink-faint);font-family:"IBM Plex Mono";font-size:1.5rem;line-height:1;flex:none;}
.confirm-box{border-top:1px dashed var(--border);padding-top:16px;display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;}
.leaf-note{font-size:.82rem;color:var(--ink-faint);}
.nav-links{display:flex;gap:16px;margin-bottom:14px;font-size:.82rem;}
.nav-links button{background:none;border:none;color:var(--ink-dim);cursor:pointer;font-weight:600;padding:0;font-size:inherit;font-family:inherit;}
.nav-links button:hover{color:var(--accent-strong);}

/* results-of-one summary */
.score-hero{display:flex;gap:24px;align-items:center;margin-bottom:6px;flex-wrap:wrap;}
.score-num{font-family:"Fraunces",serif;font-size:2.6rem;font-weight:600;}
.taskrow{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--border);}
.taskrow:last-child{border-bottom:none;}
.pill{width:22px;height:22px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:.75rem;font-weight:700;flex:none;}
.pill.ok{background:var(--success-soft);color:var(--success);}
.pill.no{background:var(--danger-soft);color:var(--danger);}
.pill.skip{background:var(--surface-3);color:var(--ink-faint);}
.taskrow .t{flex:1;font-size:.88rem;}
.taskrow .meta{font-size:.76rem;color:var(--ink-faint);font-family:"IBM Plex Mono";}

/* stats dashboard */
.stat-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:14px;margin-bottom:20px;}
.stat-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:16px 18px;box-shadow:var(--shadow);}
.stat-card .num{font-family:"Fraunces",serif;font-size:1.9rem;font-weight:600;line-height:1;}
.stat-card .lbl{font-size:.76rem;color:var(--ink-dim);margin-top:6px;}
table{width:100%;border-collapse:collapse;font-size:.85rem;}
th{text-align:left;font-size:.72rem;text-transform:uppercase;letter-spacing:.04em;color:var(--ink-faint);padding:8px 10px;border-bottom:1px solid var(--border);}
td{padding:11px 10px;border-bottom:1px solid var(--border);vertical-align:top;}
tr:last-child td{border-bottom:none;}
.bar-track{background:var(--surface-2);border-radius:5px;height:9px;width:120px;overflow:hidden;}
.bar-fill{height:100%;border-radius:5px;background:var(--accent);}
.bar-fill.low{background:var(--danger);}
.bar-fill.mid{background:var(--warn);}
.tbl-wrap{overflow-x:auto;}

/* task-level direct/indirect breakdown */
:root{ --succ-d:var(--success); --succ-i:#7C6FCE; --fail-d:var(--danger); --fail-i:var(--warn); --skip-c:var(--ink-faint); --direct-c:#3B6FB9; --nominated-c:#E0A526; }
.task-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:20px 22px;box-shadow:var(--shadow);margin-bottom:16px;}
.task-card-head{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;margin-bottom:16px;}
.task-card-head .task-title{font-weight:600;color:var(--ink);font-size:.95rem;max-width:640px;}
.task-card-head .task-meta{font-size:.76rem;color:var(--ink-faint);margin-top:4px;}
.breakdown-grid{display:grid;grid-template-columns:230px 1fr;gap:24px;align-items:center;}
@media(max-width:640px){.breakdown-grid{grid-template-columns:1fr;}}
.pie-wrap{width:100%;max-width:230px;margin:0 auto;}
.breakdown-tbl{width:100%;border-collapse:collapse;font-size:.82rem;}
.breakdown-tbl td{padding:8px 6px;border-bottom:1px solid var(--border);vertical-align:middle;}
.breakdown-tbl tr:last-child td{border-bottom:none;}
.swatch{display:inline-block;width:11px;height:11px;border-radius:3px;margin-right:8px;vertical-align:middle;}
.breakdown-tbl .did-split{font-size:.74rem;color:var(--ink-faint);white-space:nowrap;}
.breakdown-tbl .did-split b{color:var(--ink-dim);font-weight:600;}
.breakdown-tbl .total-col{text-align:right;font-family:"IBM Plex Mono",monospace;}
.breakdown-tbl .pct-col{text-align:right;font-family:"IBM Plex Mono",monospace;font-weight:600;color:var(--ink);width:52px;}
.breakdown-foot{font-size:.72rem;color:var(--ink-faint);margin-top:6px;font-style:italic;}

/* success/directness confidence-interval bars */
.ci-bar-wrap{position:relative;height:16px;margin:2px 0 4px;}
.ci-bar-track{position:absolute;inset:0;background:var(--surface-2);border-radius:6px;overflow:hidden;}
.ci-bar-fill{position:absolute;top:0;bottom:0;left:0;border-radius:6px;}
.ci-whisker{position:absolute;top:50%;height:1.5px;background:var(--ink);transform:translateY(-50%);}
.ci-whisker::before,.ci-whisker::after{content:'';position:absolute;top:-6px;height:12px;width:1.5px;background:var(--ink);}
.ci-whisker::before{left:0;}
.ci-whisker::after{right:0;}

/* results sub-tabs */
.subtabs{display:flex;gap:4px;background:var(--surface-2);padding:4px;border-radius:10px;margin:14px 0 16px;width:fit-content;}
.subtab{border:none;background:none;padding:7px 14px;border-radius:7px;font-size:.82rem;font-weight:600;color:var(--ink-dim);cursor:pointer;}
.subtab.active{background:var(--surface);color:var(--ink);box-shadow:var(--shadow);}
.subtab:hover:not(.active){color:var(--ink);}

/* outcome badges (journeys view) */
.badge{display:inline-block;padding:3px 10px;border-radius:999px;font-size:.72rem;font-weight:700;white-space:nowrap;background:color-mix(in srgb, var(--tint) 16%, var(--surface));color:var(--tint);}

/* click-paths pietree */
.pietree-scroll{overflow-x:auto;padding:4px 0 8px;}
.pietree-scroll svg{display:block;}
.legend-row{display:flex;gap:8px;margin-bottom:6px;align-items:center;}

/* tree editor */
.tree-editor ul{list-style:none;margin:0;padding-left:22px;border-left:1px dashed var(--border);}
.tree-editor > ul{padding-left:0;border-left:none;}
.tree-node{margin:6px 0;}
.tree-node-row{display:flex;align-items:center;gap:6px;}
.tree-node-row input[type=text]{flex:1;padding:6px 9px;font-size:.85rem;}
.node-actions{display:flex;gap:3px;}
.icon-btn{border:1px solid var(--border);background:var(--surface);width:26px;height:26px;border-radius:6px;cursor:pointer;font-size:.8rem;color:var(--ink-dim);display:flex;align-items:center;justify-content:center;}
.icon-btn:hover{border-color:var(--accent);color:var(--accent-strong);}

.task-editor-card{border:1px solid var(--border);border-radius:10px;padding:14px;background:var(--surface-2);margin-bottom:12px;}
.chip{display:inline-flex;align-items:center;gap:6px;background:var(--accent-soft);color:var(--accent-strong);border-radius:999px;padding:4px 10px;font-size:.76rem;font-weight:600;margin:3px 4px 0 0;}
.chip button{background:none;border:none;cursor:pointer;color:inherit;font-weight:700;padding:0;}
.node-picker{max-height:180px;overflow-y:auto;border:1px solid var(--border);border-radius:8px;padding:8px 10px;background:var(--surface);}
.node-picker label{display:block;font-weight:400;font-size:.82rem;color:var(--ink);margin:2px 0;cursor:pointer;}

.gate{max-width:380px;margin:80px auto;}
.footer-note{text-align:center;color:var(--ink-faint);font-size:.78rem;padding:20px;}
.divider{height:1px;background:var(--border);margin:22px 0;}
.copy-box{position:relative;}
.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:8px;font-size:.85rem;box-shadow:var(--shadow);z-index:50;}
[hidden]{display:none!important;}
</style>
</head>
<body>
<script type="application/json" id="study-data">{"study": {"title": "Cedar Grove Library \u2014 Website Navigation", "intro": "We're testing a proposed navigation structure for the Cedar Grove Public Library website. You'll be given a few short tasks \u2014 just click through the categories the way you would on a real site.", "contactEmail": "abikowski@reingold.com", "adminPass": "reingold", "isExample": true, "endpointUrl": "", "resultsKey": "", "sheetUrl": "", "tree": {"id": "root_home", "label": "Home", "children": [{"id": "n_books", "label": "Books & Media", "children": [{"id": "n_catalog", "label": "Search the Catalog", "children": []}, {"id": "n_ebooks", "label": "eBooks & Audiobooks", "children": []}, {"id": "n_renew", "label": "Renew or Return Items", "children": []}]}, {"id": "n_programs", "label": "Programs & Events", "children": [{"id": "n_storytime", "label": "Story Time for Kids", "children": []}, {"id": "n_classes", "label": "Adult Classes & Workshops", "children": []}, {"id": "n_calendar", "label": "Event Calendar", "children": []}]}, {"id": "n_account", "label": "Library Card & Account", "children": [{"id": "n_apply", "label": "Apply for a Card", "children": []}, {"id": "n_manage", "label": "Manage Your Account", "children": []}, {"id": "n_fines", "label": "Fines & Fees", "children": []}]}, {"id": "n_locations", "label": "Locations & Hours", "children": [{"id": "n_branches", "label": "Branch Locations", "children": []}, {"id": "n_holidayhours", "label": "Holiday Hours", "children": []}]}, {"id": "n_about", "label": "About the Library", "children": [{"id": "n_mission", "label": "Mission & History", "children": []}, {"id": "n_board", "label": "Board Meetings", "children": []}, {"id": "n_careers", "label": "Careers", "children": []}]}]}, "tasks": [{"id": "t1", "text": "You want to know if the library is open on Thanksgiving.", "correctIds": ["n_holidayhours"]}, {"id": "t2", "text": "Your child wants to go to a weekend story time. Where would you look to find out when it happens?", "correctIds": ["n_storytime", "n_calendar"]}]}, "results": []}</script>
<div id="app"></div>
<script>
(function(){
"use strict";

/* ---------- state ---------- */
var raw = document.getElementById('study-data').textContent;
var STATE = JSON.parse(raw);
// STATE = { study: {title, intro, tree, tasks, adminPass}, results: [] }

function uid(prefix){ return prefix + '_' + Math.random().toString(36).slice(2,9); }

function findNode(tree, id){
  if(tree.id === id) return tree;
  if(!tree.children) return null;
  for(var i=0;i<tree.children.length;i++){
    var f = findNode(tree.children[i], id);
    if(f) return f;
  }
  return null;
}
function findPathIds(tree, id, path){
  path = path || [];
  path = path.concat([tree.id]);
  if(tree.id === id) return path;
  if(!tree.children) return null;
  for(var i=0;i<tree.children.length;i++){
    var f = findPathIds(tree.children[i], id, path);
    if(f) return f;
  }
  return null;
}
function nodeLabel(tree, id){ var n = findNode(tree, id); return n ? n.label : '(deleted item)'; }

/* ---------- routing ---------- */
function route(){ return (location.hash || '#test').replace('#',''); }
window.addEventListener('hashchange', render);

/* ---------- gate (lightweight, not real security) ---------- */
function isUnlocked(){ return sessionStorage.getItem('wf_unlocked') === '1'; }
function unlock(pass){
  if(pass === (STATE.study.adminPass || '')){ sessionStorage.setItem('wf_unlocked','1'); return true; }
  return false;
}

/* ---------- rebuild the whole page as a downloadable static file ---------- */
function buildFullDocument(){
  var dataBlock = '<script type="application/json" id="study-data">' + JSON.stringify(STATE).replace(/</g,'\\u003c') + '<\/script>';
  return '<!doctype html>\n' + document.documentElement.outerHTML.replace(
    /<script type="application\/json" id="study-data">[\s\S]*?<\/script>/,
    dataBlock
  );
}
function downloadUpdatedSite(){
  var blob = new Blob([buildFullDocument()], {type:'text/html'});
  var url = URL.createObjectURL(blob);
  var a = document.createElement('a');
  a.href = url; a.download = 'index.html';
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(function(){ URL.revokeObjectURL(url); }, 4000);
}

function toast(msg){
  var el = document.createElement('div');
  el.className = 'toast';
  el.textContent = msg;
  document.body.appendChild(el);
  setTimeout(function(){ el.remove(); }, 3200);
}

/* ================= TAKE TEST ================= */
var testSession = null; // {taskIndex, path:[rootid], startedAt, backtracks, answers:[], clickLog:[]}

function newTestSession(){
  return { taskIndex: -1, path: [STATE.study.tree.id], startedAt: 0, backtracks: 0, answers: [], clickLog: [], selectedLeafId: null };
}

function renderIntro(root){
  var s = STATE.study;
  root.innerHTML =
    '<div class="wrap">' +
      '<div class="intro-hero"><span class="eyebrow">Tree Test</span><h1>' + esc(s.title) + '</h1><p>' + esc(s.intro).replace(/\\n/g,'<br>') + '</p></div>' +
      '<div class="card">' +
        '<p style="margin-bottom:10px"><strong>Here\'s how it works:</strong></p>' +
        '<ul style="margin:0 0 16px 1.1em;padding:0;color:var(--ink-dim)">' +
          '<li style="margin-bottom:6px">You will be asked to find a certain item and presented with a list of links.</li>' +
          '<li style="margin-bottom:6px">Click through the list until you arrive at one that you think helps you complete the task.</li>' +
          '<li>If you take a wrong turn, you can go back by clicking one of the links above.</li>' +
        '</ul>' +
        '<p style="margin-bottom:16px">This is not a test of your ability, there are no right or wrong answers.<br>That\'s it, let\'s get started!</p>' +
        '<button class="btn btn-primary" id="start-btn">Start' + (s.tasks.length? '' : '') + ' \u2192</button>' +
      '</div>' +
    '</div>';
  document.getElementById('start-btn').onclick = function(){
    testSession = newTestSession();
    nextTask();
  };
}

function nextTask(){
  testSession.taskIndex++;
  if(testSession.taskIndex >= STATE.study.tasks.length){ renderTestDone(); return; }
  testSession.path = [STATE.study.tree.id];
  testSession.backtracks = 0;
  testSession.selectedLeafId = null;
  testSession.clickLog = [{ id: STATE.study.tree.id, action: 'start' }];
  testSession.startedAt = performance.now();
  renderTaskScreen();
}

function currentNode(){ return findNode(STATE.study.tree, testSession.path[testSession.path.length-1]); }

function renderTaskScreen(){
  var root = document.getElementById('app');
  var s = STATE.study;
  var t = s.tasks[testSession.taskIndex];
  var node = currentNode();
  var atRoot = testSession.path.length === 1;
  var dots = s.tasks.map(function(_,i){
    var cls = i < testSession.taskIndex ? 'done' : (i === testSession.taskIndex ? 'current' : '');
    return '<span class="dot ' + cls + '"></span>';
  }).join('');
  var crumbLabels = testSession.path.map(function(id){ return nodeLabel(s.tree, id); });
  var crumbHtml = crumbLabels.map(function(l,i){ return (i===crumbLabels.length-1? '<b>'+esc(l)+'</b>' : esc(l)); }).join(' <span style="opacity:.5">\u203A</span> ');
  var kids = node.children || [];
  var selectedId = testSession.selectedLeafId;
  var kidsHtml = kids.length ? kids.map(function(c){
    var hasKids = c.children && c.children.length;
    if(hasKids) return '<li><button class="node-btn" data-nav="'+c.id+'"><span>'+esc(c.label)+'</span><span class="chev">\u203A</span></button></li>';
    var isSelected = c.id === selectedId;
    return '<li><button class="node-btn'+(isSelected?' selected':'')+'" data-select="'+c.id+'"><span>'+esc(c.label)+'</span>'+(isSelected?'<span class="chev" style="color:var(--accent-strong)">\u2713</span>':'')+'</button></li>';
  }).join('') : '';

  var leafNote = atRoot
    ? 'Pick a category above to begin exploring.'
    : (selectedId ? 'Ready to submit that as your answer?' : 'Click an item above to select it as your answer.');

  root.innerHTML =
    '<div class="wrap">' +
      '<div class="progress">' + dots + '</div>' +
      '<div class="task-label">Task ' + (testSession.taskIndex+1) + ' of ' + s.tasks.length + '</div>' +
      '<div class="task-text">' + esc(t.text) + '</div>' +
      '<div class="nav-links">' +
        (atRoot ? '' : '<button id="back-btn">\u2190 Back</button>') +
        (atRoot ? '' : '<button id="restart-btn">Start over</button>') +
      '</div>' +
      '<div class="crumbs">' + crumbHtml + '</div>' +
      (kids.length ? '<ul class="node-list">'+kidsHtml+'</ul>' : '<p style="font-style:italic">There\'s nothing more under here \u2014 use Back to try a different path.</p>') +
      '<div class="confirm-box">' +
        '<span class="leaf-note">' + leafNote + '</span>' +
        '<button class="btn btn-primary" id="confirm-btn" ' + (selectedId?'':'disabled') + '>\u2713 I\'d find my answer here</button>' +
      '</div>' +
    '</div>';

  root.querySelectorAll('[data-nav]').forEach(function(b){
    b.onclick = function(){
      var id = b.getAttribute('data-nav');
      testSession.path.push(id);
      testSession.selectedLeafId = null;
      testSession.clickLog.push({ id: id, action: 'nav' });
      renderTaskScreen();
    };
  });
  root.querySelectorAll('[data-select]').forEach(function(b){
    b.onclick = function(){
      var id = b.getAttribute('data-select');
      // selecting only highlights the item and arms the confirm button \u2014
      // it does not submit the task by itself
      testSession.selectedLeafId = (testSession.selectedLeafId === id) ? null : id;
      renderTaskScreen();
    };
  });
  var backBtn = document.getElementById('back-btn');
  if(backBtn) backBtn.onclick = function(){
    testSession.path.pop();
    testSession.backtracks++;
    testSession.selectedLeafId = null;
    testSession.clickLog.push({ id: testSession.path[testSession.path.length-1], action: 'back' });
    renderTaskScreen();
  };
  var restartBtn = document.getElementById('restart-btn');
  if(restartBtn) restartBtn.onclick = function(){
    testSession.backtracks++;
    testSession.path = [s.tree.id];
    testSession.selectedLeafId = null;
    testSession.clickLog.push({ id: s.tree.id, action: 'restart' });
    renderTaskScreen();
  };
  var confirmBtn = document.getElementById('confirm-btn');
  if(confirmBtn) confirmBtn.onclick = function(){
    if(!testSession.selectedLeafId) return; // guard \u2014 button should be disabled anyway
    testSession.clickLog.push({ id: testSession.selectedLeafId, action: 'select' });
    recordAnswer(testSession.selectedLeafId, false);
  };
}

function recordAnswer(destId, skipped){
  var s = STATE.study;
  var t = s.tasks[testSession.taskIndex];
  var elapsed = Math.round(performance.now() - testSession.startedAt);
  var correct = !skipped && t.correctIds && t.correctIds.indexOf(destId) !== -1;
  var direct = testSession.backtracks === 0;
  var pathLabels = testSession.clickLog.map(function(e){ return nodeLabel(s.tree, e.id); });
  testSession.answers.push({
    taskId: t.id, taskText: t.text, destId: destId,
    destLabel: (skipped || destId==null) ? '' : nodeLabel(s.tree, destId),
    skipped: skipped, correct: !!correct, direct: direct,
    timeMs: elapsed, backtracks: testSession.backtracks, pathLen: testSession.path.length - 1,
    path: pathLabels.join(' › '),
    /* structured id+action trail, for the Click paths pietree — mirrors `path`
       but keeps node identity + action type so outcomes can be classified per node */
    trail: testSession.clickLog.map(function(e){ return { id: e.id, action: e.action }; })
  });
  nextTask();
}

function removeNode(tree, id){
  if(!tree.children) return false;
  for(var i=0;i<tree.children.length;i++){
    if(tree.children[i].id === id){ tree.children.splice(i,1); return true; }
    if(removeNode(tree.children[i], id)) return true;
  }
  return false;
}

/* ================= RESULTS (admin) ================= */

/* A response row is "direct" if the respondent never clicked Back or
   Start over during that task — "indirect" means they got there (right
   or wrong) after backtracking at least once. Success/Fail/Skip each
   split into Direct/Indirect, mirroring Treejack's breakdown. */
function isDirectRow(r){
  if(r.direct === 'yes') return true;
  if(r.direct === 'no') return false;
  return Number(r.backtracks) === 0; // fallback for older saved rows
}

function classifyRows(list){
  var succD=0, succI=0, failD=0, failI=0, skipD=0, skipI=0;
  list.forEach(function(r){
    var direct = isDirectRow(r);
    if(r.skipped === 'yes'){ direct ? skipD++ : skipI++; }
    else if(r.correct === 'yes'){ direct ? succD++ : succI++; }
    else { direct ? failD++ : failI++; }
  });
  var total = list.length;
  function pct(x){ return total ? Math.round(100*x/total) : 0; }
  return {
    total: total,
    succD:succD, succI:succI, succTotal:succD+succI, succPct: pct(succD+succI),
    failD:failD, failI:failI, failTotal:failD+failI, failPct: pct(failD+failI),
    skipD:skipD, skipI:skipI, skipTotal:skipD+skipI, skipPct: pct(skipD+skipI),
    directPct: pct(succD+failD+skipD)
  };
}

function computeStatsFromRows(rows, tasks){
  var totalSessions = {};
  rows.forEach(function(r){ totalSessions[r.session_id] = true; });
  var n = rows.length;
  var overall = classifyRows(rows);
  var avgTime = n ? Math.round(rows.reduce(function(sum,r){return sum+Number(r.time_seconds||0);},0)/n*10)/10 : 0;

  var perTask = tasks.map(function(t){
    var ans = rows.filter(function(r){ return r.task === t.text; });
    var c = classifyRows(ans);
    var time = ans.length ? Math.round(ans.reduce(function(sum,r){return sum+Number(r.time_seconds||0);},0)/ans.length*10)/10 : 0;
    var destCounts = {};
    ans.forEach(function(r){ var k = r.skipped==='yes' ? 'Gave up' : (r.landed_on||'(unknown)'); destCounts[k] = (destCounts[k]||0)+1; });
    var topDest = Object.keys(destCounts).sort(function(a,b){return destCounts[b]-destCounts[a];});
    // separate tally of ONLY the wrong landings, for "most misses landed on X" —
    // destCounts above mixes in the correct answer's own landings, which would
    // otherwise get miscounted as the top "wrong" destination.
    var wrongDestCounts = {};
    ans.forEach(function(r){
      if(r.correct === 'yes' || r.skipped === 'yes') return;
      var k = r.landed_on || '(unknown)';
      wrongDestCounts[k] = (wrongDestCounts[k]||0)+1;
    });
    var topWrongDest = Object.keys(wrongDestCounts).sort(function(a,b){return wrongDestCounts[b]-wrongDestCounts[a];});
    return { task:t, avgTime:time, destCounts:destCounts, topDest:topDest, wrongDestCounts:wrongDestCounts, topWrongDest:topWrongDest, stats:c };
  });

  return { totalSessions:Object.keys(totalSessions).length, overall:overall, avgTime:avgTime, perTask:perTask };
}

function barClass(pct){ return pct>=70?'':(pct>=40?'mid':'low'); }

/* ---- pie chart with floating %-labels (matches the researcher's Treejack-style reference) ---- */
function polarToXY(cx, cy, r, angleDeg){
  var rad = (angleDeg - 90) * Math.PI / 180;
  return { x: cx + r * Math.cos(rad), y: cy + r * Math.sin(rad) };
}
function arcPath(cx, cy, r, startAngle, endAngle){
  var start = polarToXY(cx, cy, r, startAngle);
  var end = polarToXY(cx, cy, r, endAngle);
  var largeArc = (endAngle - startAngle) > 180 ? 1 : 0;
  return 'M ' + cx + ' ' + cy + ' L ' + start.x + ' ' + start.y +
    ' A ' + r + ' ' + r + ' 0 ' + largeArc + ' 1 ' + end.x + ' ' + end.y + ' Z';
}
function pieChartSVG(slices, size){
  size = size || 200;
  var cx = size/2, cy = size/2, r = size*0.32, labelR = size*0.44;
  var total = slices.reduce(function(sum,s){ return sum + s.pct; }, 0);
  if(total <= 0){
    return '<svg viewBox="0 0 '+size+' '+size+'" width="100%" style="max-width:'+size+'px;display:block;margin:0 auto">' +
      '<circle cx="'+cx+'" cy="'+cy+'" r="'+r+'" fill="var(--surface-2)"/></svg>';
  }
  var acc = 0, paths = '', labels = '';
  slices.forEach(function(s){
    if(s.pct <= 0) return;
    var start = acc/total*360, end = (acc+s.pct)/total*360;
    var pctRound = Math.round(s.pct/total*100);
    var titleText = (s.label ? s.label + ': ' : '') + pctRound + '% (' + s.pct + ' of ' + total + ')';
    paths += '<path d="'+arcPath(cx,cy,r,start,end)+'" fill="'+s.color+'"><title>'+esc(titleText)+'</title></path>';
    var mid = (start+end)/2;
    if(pctRound > 0){
      var lp1 = polarToXY(cx,cy,r+4,mid);
      var lp2 = polarToXY(cx,cy,labelR-10,mid);
      var tp = polarToXY(cx,cy,labelR,mid);
      var anchor = tp.x > cx+3 ? 'start' : (tp.x < cx-3 ? 'end' : 'middle');
      labels += '<line x1="'+lp1.x+'" y1="'+lp1.y+'" x2="'+lp2.x+'" y2="'+lp2.y+'" stroke="var(--ink-faint)" stroke-width="1"/>';
      labels += '<text x="'+tp.x+'" y="'+tp.y+'" text-anchor="'+anchor+'" dominant-baseline="middle" font-size="11" font-family="IBM Plex Sans, sans-serif" fill="var(--ink-dim)">'+pctRound+'%</text>';
    }
    acc += s.pct;
  });
  return '<svg viewBox="0 0 '+size+' '+size+'" width="100%" style="max-width:'+size+'px;display:block;margin:0 auto">'+paths+labels+'</svg>';
}

/* ---- Wilson-score confidence interval, for the Success/Directness whisker bars ---- */
function wilsonCI(successCount, n){
  if(!n) return { lo:0, hi:0 };
  var z = 1.96;
  var phat = successCount / n;
  var denom = 1 + (z*z)/n;
  var center = (phat + (z*z)/(2*n)) / denom;
  var margin = (z * Math.sqrt((phat*(1-phat))/n + (z*z)/(4*n*n))) / denom;
  return { lo: Math.max(0,(center-margin))*100, hi: Math.min(1,(center+margin))*100 };
}
function ciBarHtml(label, pct, ci, colorVar){
  var lo = Math.min(ci.lo, pct), hi = Math.max(ci.hi, pct);
  var w = Math.max(0.5, hi - lo);
  return (
    '<div style="margin-top:14px">' +
      '<div class="row between" style="margin-bottom:4px"><strong style="font-size:.82rem">'+label+'</strong><span class="mono" style="font-weight:600">'+Math.round(pct)+'%</span></div>' +
      '<div class="ci-bar-wrap">' +
        '<div class="ci-bar-track"><div class="ci-bar-fill" style="width:'+pct+'%;background:'+colorVar+'"></div></div>' +
        '<div class="ci-whisker" style="left:'+lo+'%;width:'+w+'%"></div>' +
      '</div>' +
    '</div>'
  );
}

/* Renders one task's Direct/Indirect Success/Fail/Skip pie + table,
   in the style of Optimal Workshop's Treejack task breakdown. */
function taskBreakdownHtml(row){
  var c = row.stats;
  var slices = [
    { pct: c.succD, color: 'var(--succ-d)', label: 'Success (direct)' },
    { pct: c.succI, color: 'var(--succ-i)', label: 'Success (indirect)' },
    { pct: c.failD, color: 'var(--fail-d)', label: 'Fail (direct)' },
    { pct: c.failI, color: 'var(--fail-i)', label: 'Fail (indirect)' }
  ];
  function tblRow(label, color, d, i, total, pct){
    return '<tr>' +
      '<td><span class="swatch" style="background:'+color+'"></span>'+label+'</td>' +
      '<td class="did-split">Direct <b>'+d+'</b> &nbsp; Indirect <b>'+i+'</b></td>' +
      '<td class="total-col">'+total+'</td>' +
      '<td class="pct-col">'+pct+'%</td>' +
    '</tr>';
  }
  var succCI = wilsonCI(c.succTotal, c.total);
  var dirCI = wilsonCI(c.succD + c.failD + c.skipD, c.total);
  return (
    '<div class="task-card">' +
      '<div class="task-card-head">' +
        '<div><div class="task-title">'+esc(row.task.text||'(untitled task)')+'</div>' +
        '<div class="task-meta">'+c.total+' response'+(c.total===1?'':'s')+' · avg '+row.avgTime+'s</div></div>' +
      '</div>' +
      '<div class="breakdown-grid">' +
        '<div class="pie-wrap">'+pieChartSVG(slices, 200)+'</div>' +
        '<table class="breakdown-tbl"><tbody>' +
          tblRow('Success','var(--succ-d)',c.succD,c.succI,c.succTotal,c.succPct) +
          tblRow('Fail','var(--fail-d)',c.failD,c.failI,c.failTotal,c.failPct) +
        '</tbody></table>' +
      '</div>' +
      ciBarHtml('Success', c.succPct, succCI, 'var(--success)') +
      ciBarHtml('Directness', c.directPct, dirCI, 'var(--direct-c)') +
      '<div class="breakdown-foot">Direct = got there without clicking Back or Start over. Indirect = backtracked at least once along the way, right or wrong answer either way. Whiskers show a 95% confidence range for this sample size.</div>' +
    '</div>'
  );
}

/* ---- outcome classification shared by the breakdown table + journeys view ---- */
/* ================= "Sessions" — one row per respondent, with delete ================= */
/* A response is only ever sent once someone finishes every task (see
   renderTestDone), so there's no such thing as a genuinely partial row in
   the Sheet — "Partial" below only ever means the study's task list has
   changed (grown) since that person took the test, not that they quit early. */
function groupRowsBySession(rows){
  var groups = {}, order = [];
  rows.forEach(function(r){
    var sid = r.session_id || '(unknown)';
    if(!groups[sid]){ groups[sid] = []; order.push(sid); }
    groups[sid].push(r);
  });
  order.sort(function(a,b){
    var ta = groups[a][0] && groups[a][0].timestamp ? new Date(groups[a][0].timestamp).getTime() : 0;
    var tb = groups[b][0] && groups[b][0].timestamp ? new Date(groups[b][0].timestamp).getTime() : 0;
    return tb - ta;
  });
  return { groups: groups, order: order };
}

function deleteSessionRows(endpointUrl, resultsKey, sessionId, onDone){
  fetch(endpointUrl + '?key=' + encodeURIComponent(resultsKey||'') + '&action=delete&session_id=' + encodeURIComponent(sessionId))
    .then(function(r){ return r.json(); })
    .then(function(data){ onDone(!!(data && data.ok), data); })
    .catch(function(){ onDone(false); });
}

function sessionsHtml(rows, tasks){
  if(!rows.length){
    return '<div class="card"><p style="margin:0">No submissions yet. Share the link from Researcher tools — sessions will appear here automatically as people finish.</p></div>';
  }
  var grouped = groupRowsBySession(rows);
  var expectedTaskCount = tasks.length;

  var rowsHtml = grouped.order.map(function(sid){
    var sessionRows = grouped.groups[sid];
    var succ = sessionRows.filter(function(r){ return r.correct === 'yes'; }).length;
    var total = sessionRows.length;
    var pct = total ? Math.round(100*succ/total) : 0;
    var totalTime = Math.round(sessionRows.reduce(function(sum,r){ return sum+Number(r.time_seconds||0); }, 0)*10)/10;
    var when = sessionRows[0].timestamp ? new Date(sessionRows[0].timestamp).toLocaleString() : '—';
    var respondent = sessionRows[0].respondent || '';
    var isComplete = total >= expectedTaskCount;
    return '<tr>' +
      '<td class="mono" style="white-space:nowrap">'+esc(sid)+'</td>' +
      '<td class="mono" style="white-space:nowrap">'+esc(respondent||'—')+'</td>' +
      '<td style="white-space:nowrap;font-size:.82rem;color:var(--ink-dim)">'+esc(when)+'</td>' +
      '<td class="mono">'+succ+' / '+total+' ('+pct+'%)</td>' +
      '<td class="mono">'+totalTime+'s</td>' +
      '<td>'+(isComplete
        ? '<span class="badge" style="--tint:var(--succ-d)">Complete</span>'
        : '<span class="badge" style="--tint:var(--warn)">'+total+' of '+expectedTaskCount+'</span>') + '</td>' +
      '<td><button class="btn btn-sm btn-danger" data-delete-session="'+esc(sid)+'">Delete</button></td>' +
    '</tr>';
  }).join('');

  return (
    '<div class="card" style="margin-bottom:16px"><p style="margin:0;font-size:.84rem;color:var(--ink-dim)">Every completed session, most recent first. Responses only ever save once someone finishes the whole test, so "Complete" is the norm — a session showing fewer tasks than expected usually just means the study changed after they took it.</p></div>' +
    '<div class="tbl-wrap"><table><thead><tr><th>Session ID</th><th>Respondent</th><th>Submitted</th><th>Outcome</th><th>Total time</th><th>Status</th><th></th></tr></thead><tbody>'+rowsHtml+'</tbody></table></div>'
  );
}

function classifyOutcome(r){
  var direct = isDirectRow(r);
  if(r.skipped === 'yes') return { label: direct ? 'Skip' : 'Skip (indirect)', tint: 'var(--skip-c)' };
  if(r.correct === 'yes') return { label: direct ? 'Direct success' : 'Indirect success', tint: direct ? 'var(--succ-d)' : 'var(--succ-i)' };
  return { label: direct ? 'Direct fail' : 'Indirect fail', tint: direct ? 'var(--fail-d)' : 'var(--fail-i)' };
}

/* ---- "User journeys" view: every response's full click path, per task ---- */
/* Sortable, defaulting to most-recent-first; clicking a column header sorts
   by that column instead (toggling direction on repeated clicks) while every
   task's table stays in sync since the sort is shared across the view. */
var journeySort = { key: 'timestamp', dir: 'desc' };

function journeySortValue(r, key){
  switch(key){
    case 'timestamp': return r.timestamp ? new Date(r.timestamp).getTime() : 0;
    case 'time_seconds': return Number(r.time_seconds || 0);
    case 'backtracks': return Number(r.backtracks || 0);
    case 'outcome': return classifyOutcome(r).label;
    case 'respondent': return (r.respondent || r.session_id || '').toLowerCase();
    case 'path': return (r.path || r.landed_on || '').toLowerCase();
    default: return '';
  }
}
function sortJourneyRows(list){
  var key = journeySort.key, mul = journeySort.dir === 'asc' ? 1 : -1;
  return list.slice().sort(function(a,b){
    var av = journeySortValue(a,key), bv = journeySortValue(b,key);
    if(av < bv) return -1*mul;
    if(av > bv) return 1*mul;
    return 0;
  });
}
function sortArrow(key){ return journeySort.key === key ? (journeySort.dir === 'asc' ? ' ↑' : ' ↓') : ''; }
function sortTh(label, key){
  return '<th data-sort-key="'+key+'" style="cursor:pointer;user-select:none" title="Sort by '+esc(label)+'">'+esc(label)+sortArrow(key)+'</th>';
}

function journeysHtml(rows, tasks){
  var headHtml = '<tr>' +
    sortTh('Respondent','respondent') +
    sortTh('Path clicked','path') +
    sortTh('Outcome','outcome') +
    sortTh('Time','time_seconds') +
    sortTh('Backtracks','backtracks') +
  '</tr>';
  return tasks.map(function(t){
    var ans = sortJourneyRows(rows.filter(function(r){ return r.task === t.text; }));
    var rowsHtml = ans.map(function(r){
      var outcome = classifyOutcome(r);
      return '<tr>' +
        '<td class="mono" style="white-space:nowrap">'+esc(r.respondent||r.session_id||'')+'</td>' +
        '<td style="font-size:.82rem;color:var(--ink-dim)">'+esc(r.path || r.landed_on || '(no path recorded)')+'</td>' +
        '<td><span class="badge" style="--tint:'+outcome.tint+'">'+outcome.label+'</span></td>' +
        '<td class="mono">'+(r.time_seconds!=null && r.time_seconds!=='' ? r.time_seconds+'s' : '—')+'</td>' +
        '<td class="mono">'+(r.backtracks!=null && r.backtracks!=='' ? r.backtracks : '—')+'</td>' +
      '</tr>';
    }).join('');
    return (
      '<div class="task-card">' +
        '<div class="task-card-head"><div class="task-title">'+esc(t.text||'(untitled task)')+'</div></div>' +
        (ans.length
          ? '<div class="tbl-wrap"><table><thead>'+headHtml+'</thead><tbody>'+rowsHtml+'</tbody></table></div>'
          : '<p style="margin:0">No responses yet for this task.</p>') +
      '</div>'
    );
  }).join('');
}

/* ================= "Click paths" pietree — Treejack-style node diagram ================= */

/* Every ancestor id (root..node) reachable to any of a task's correct answers. */
function correctChainIdSet(tree, correctIds){
  var set = {};
  (correctIds||[]).forEach(function(cid){
    ancestorChain(tree, cid).forEach(function(n){ set[n.id] = true; });
  });
  return set;
}

/* Classifies every landing in every respondent's trail: continuing toward the
   right answer (green), continuing down a wrong branch (red), backtracking
   away from this node (blue), or this being where they finally answered
   (amber) — aggregated per node so each node's pie shows the mix of what
   people did once they got there. */
function buildPietreeStats(trails, correctSet){
  var stats = {};
  function ensure(id){ if(!stats[id]) stats[id] = { id:id, visits:0, right:0, wrong:0, back:0, nominated:0 }; return stats[id]; }
  trails.forEach(function(trail){
    for(var i=0;i<trail.length;i++){
      var s = ensure(trail[i].id);
      s.visits++;
      var isLast = i === trail.length - 1;
      if(isLast){ s.nominated++; continue; }
      var nextAction = trail[i+1].action;
      if(nextAction === 'back' || nextAction === 'restart'){ s.back++; }
      else if(correctSet[trail[i+1].id]){ s.right++; }
      else { s.wrong++; }
    }
  });
  return stats;
}

/* A copy of the study tree pruned down to only the nodes people actually visited. */
function buildPrunedTree(tree, stats){
  function clone(node){
    if(!stats[node.id]) return null;
    var kids = (node.children||[]).map(clone).filter(Boolean);
    return { id: node.id, label: node.label, children: kids };
  }
  return clone(tree) || { id: tree.id, label: tree.label, children: [] };
}

/* Simple left-to-right tidy tree layout: depth -> x, leaf-stacking -> y. */
function layoutHorizontalTree(root, xGap, yGap){
  var positioned = [];
  var nextSlot = 0;
  function assign(node, depth){
    var y;
    if(!node.children || !node.children.length){
      y = nextSlot * yGap;
      nextSlot++;
    } else {
      var ys = node.children.map(function(c){ return assign(c, depth+1); });
      y = (ys[0] + ys[ys.length-1]) / 2;
    }
    positioned.push({ node: node, x: depth*xGap, y: y });
    return y;
  }
  assign(root, 0);
  return positioned;
}

function pieSliceGroupSVG(cx, cy, r, slices){
  var total = slices.reduce(function(sum,s){ return sum+s.pct; }, 0);
  if(total <= 0) return '<circle cx="'+cx+'" cy="'+cy+'" r="'+r+'" fill="var(--surface-2)" stroke="var(--border)" stroke-width="1"/>';
  var acc = 0, out = '';
  slices.forEach(function(s){
    if(s.pct <= 0) return;
    var start = acc/total*360, end = (acc+s.pct)/total*360;
    var pctRound = Math.round(s.pct/total*100);
    var titleText = (s.label ? s.label + ': ' : '') + pctRound + '% (' + s.pct + ' of ' + total + ')';
    out += '<path d="'+arcPath(cx,cy,r,start,end)+'" fill="'+s.color+'"><title>'+esc(titleText)+'</title></path>';
    acc += s.pct;
  });
  return out;
}

function pietreeSVGForTask(task, rows, tree){
  var correctSet = correctChainIdSet(tree, task.correctIds||[]);
  var ans = rows.filter(function(r){ return r.task === task.text; });
  var trails = ans.map(function(r){
    var t = r.trail != null ? r.trail : r.trail_json;
    if(typeof t === 'string'){ try{ t = JSON.parse(t); }catch(e){ t = null; } }
    return (t && t.length) ? t : null;
  }).filter(Boolean);

  if(!trails.length) return '<p style="margin:0">No click data recorded for this task yet.</p>';

  var stats = buildPietreeStats(trails, correctSet);
  var pruned = buildPrunedTree(tree, stats);
  var xGap = 210, yGap = 92; // taller rows now that labels sit below each node, not beside it
  var positioned = layoutHorizontalTree(pruned, xGap, yGap);
  var posById = {};
  positioned.forEach(function(p){ posById[p.node.id] = p; });

  var maxVisits = 1;
  positioned.forEach(function(p){ maxVisits = Math.max(maxVisits, stats[p.node.id].visits); });
  function radiusFor(v){ return 8 + Math.sqrt(v/maxVisits) * 18; }

  var ys = positioned.map(function(p){ return p.y; });
  var xs = positioned.map(function(p){ return p.x; });
  var padding = 40;
  var width = Math.max.apply(null, xs) + padding*2 + 130;
  var height = Math.max.apply(null, ys) + padding*2 + 30;

  var edgesSvg = '';
  (function walkEdges(node){
    (node.children||[]).forEach(function(c){
      var a = posById[node.id], b = posById[c.id];
      var onCorrect = !!correctSet[c.id];
      edgesSvg += '<line x1="'+(a.x+padding)+'" y1="'+(a.y+padding)+'" x2="'+(b.x+padding)+'" y2="'+(b.y+padding)+'" stroke="'+(onCorrect?'var(--succ-d)':'var(--border)')+'" stroke-width="'+(onCorrect?4:2)+'"/>';
      walkEdges(c);
    });
  })(pruned);

  var nodesSvg = '';
  positioned.forEach(function(p){
    var s = stats[p.node.id];
    var cx = p.x+padding, cy = p.y+padding;
    var r = radiusFor(s.visits);
    var isRoot = p.node.id === tree.id;
    nodesSvg += pieSliceGroupSVG(cx, cy, r, [
      { pct: s.right, color: 'var(--succ-d)', label: 'Continued toward the right answer' },
      { pct: s.wrong, color: 'var(--fail-d)', label: 'Continued down a wrong path' },
      { pct: s.back, color: 'var(--direct-c)', label: 'Went back from here' },
      { pct: s.nominated, color: 'var(--nominated-c)', label: 'Picked as their answer' }
    ]);
    if(isRoot) nodesSvg += '<circle cx="'+cx+'" cy="'+cy+'" r="'+(r+4)+'" fill="none" stroke="var(--succ-d)" stroke-width="2.5"/>';
    // label sits below the node (and below any connecting line), not overlapping it
    nodesSvg += '<text x="'+cx+'" y="'+(cy+r+18)+'" text-anchor="middle" font-size="12" font-family="IBM Plex Sans, sans-serif" font-weight="'+(isRoot?'700':'500')+'" fill="var(--ink)">'+esc(p.node.label)+'</text>';
  });

  return '<div class="pietree-scroll"><svg viewBox="0 0 '+width+' '+height+'" width="'+width+'" height="'+height+'" style="min-width:'+Math.min(width,880)+'px">'+edgesSvg+nodesSvg+'</svg></div>';
}

function pietreeLegendHtml(){
  function row(color, label){
    return '<div class="legend-row"><span class="swatch" style="background:'+color+'"></span><span style="font-size:.82rem;color:var(--ink-dim)">'+label+'</span></div>';
  }
  return (
    '<div class="card" style="margin-bottom:16px">' +
      '<div class="row" style="gap:36px;flex-wrap:wrap;align-items:flex-start">' +
        '<div><div class="eyebrow" style="margin-bottom:8px">Pies — what happened at each item</div>' +
          row('var(--succ-d)','Continued toward the right answer') +
          row('var(--fail-d)','Continued down a wrong path') +
          row('var(--direct-c)','Went back from here') +
          row('var(--nominated-c)','Picked this as their answer') +
        '</div>' +
        '<div><div class="eyebrow" style="margin-bottom:8px">Lines &amp; circles</div>' +
          row('var(--succ-d)','On the correct path (thicker line)') +
          row('var(--border)','Any other path taken') +
          '<div style="font-size:.78rem;color:var(--ink-faint);margin-top:6px;max-width:220px">Circle size shows how much traffic passed through that item.</div>' +
        '</div>' +
      '</div>' +
    '</div>'
  );
}

function clickPathsHtml(rows, tasks, tree){
  return pietreeLegendHtml() + tasks.map(function(t){
    return (
      '<div class="task-card">' +
        '<div class="task-card-head"><div class="task-title">'+esc(t.text||'(untitled task)')+'</div></div>' +

  }).join('');
}

/* ================= "Analysis" — quick, rule-based per-task read ================= */
/* Not a live AI call (a self-hosted static page can't safely hold an API key) —
   this applies the exact thresholds researchers actually use: 80%+ success is a
   win and needs no commentary; splits and off-path clustering get called out. */
function analyzeTask(row){
  var c = row.stats;
  var n = c.total;
  if(!n) return { verdict: 'No data', tone: 'neutral', lines: ['No responses yet for this task.'] };

  var lines = [], verdict, tone;
  if(c.succPct >= 80){
    verdict = 'Win'; tone = 'good';
    lines.push(c.succPct + '% success (' + c.succTotal + ' of ' + n + ') — a clear win, no changes needed here.');
  } else if(c.succPct >= 60){
    verdict = 'Solid'; tone = 'good';
    lines.push(c.succPct + '% success (' + c.succTotal + ' of ' + n + ') — reasonably strong, just short of the 80% bar.');
  } else if(c.succPct >= 40){
    verdict = 'Split'; tone = 'warn';
    lines.push('Results are split — ' + c.succPct + '% succeeded and ' + c.failPct + '% didn’t, with no dominant outcome.');
  } else {
    verdict = 'Struggling'; tone = 'bad';
    lines.push('Only ' + c.succPct + '% succeeded (' + c.succTotal + ' of ' + n + ') — this item is likely mislabeled, buried, or competing with another.');
  }

  if(c.failTotal > 0 && row.topWrongDest.length){
    var top = row.topWrongDest[0], topCount = row.wrongDestCounts[top];
    var shareOfFails = Math.round(100*topCount/c.failTotal);
    if(shareOfFails >= 50 && topCount >= 2){
      lines.push('Most misses (' + shareOfFails + '%) landed on “' + top + '” — worth checking whether that item is competing with the right answer.');
    }
  }

  if(c.succTotal > 0){
    var indirectShare = Math.round(100*c.succI/c.succTotal);
    if(indirectShare >= 50){
      lines.push(indirectShare + '% of successful respondents only got there after backtracking — the direct route may not be obvious.');
    }
  }

  return { verdict: verdict, tone: tone, lines: lines };
}

function analysisTldrHtml(){
  var steps = [

    'Paste that write-up into the “Team notes” box under that task.',
    'Click “Save notes & download updated site file” at the bottom — this bakes your notes into the tool itself.',
    'Upload that downloaded file to GitHub to replace the live version, the same way you would after any other study edit.'

  return (
    '<div class="card" style="margin-bottom:16px;background:var(--warn-soft)">' +
      '<span class="eyebrow">TL;DR — adding your own analysis</span>' +
      '<ol style="margin:0;padding-left:1.2em;color:var(--ink)">' +
        steps.map(function(s){ return '<li style="margin-bottom:6px">'+esc(s)+'</li>'; }).join('') +
      '</ol>' +
    '</div>'
  );
}

function analysisHtml(stats){
  var toneColor = { good:'var(--succ-d)', warn:'var(--warn)', bad:'var(--fail-d)', neutral:'var(--skip-c)' };
  return (

      return (

            '<div><div class="task-title">'+esc(row.task.text||'(untitled task)')+'</div>' +

          '</div>' +

      );
    }).join('') +
    '<div class="card" style="margin-top:4px">' +
      '<p style="margin-bottom:10px">Notes above are saved into the study itself, right alongside the data — same as any other edit here. Save, then re-upload the file to publish them for your team.</p>' +
      '<button class="btn btn-primary" id="save-analysis-notes-btn">Save notes &amp; download updated site file</button>' +
    '</div>'
  );
}

/* Root-to-target chain of node objects — used to trace the correct-answer
   path for the Click paths pietree. */
function ancestorChain(tree, targetId){
  var chain = [];
  function walk(node){
    chain.push(node);
    if(node.id === targetId) return true;
    var kids = node.children || [];
    for(var i=0;i<kids.length;i++){ if(walk(kids[i])) return true; }
    chain.pop();
    return false;
  }
  walk(tree);
  return chain.length ? chain : [tree];
}

function renderResults(root){
  var s = STATE.study;

  if(!s.endpointUrl){
    root.innerHTML =
      '<div class="wrap-wide">' +
        '<div class="row between" style="margin-bottom:18px"><div><span class="eyebrow">Researcher tools</span><h1 style="font-size:1.6rem">Results</h1></div><a href="#setup" class="btn">← Edit study</a></div>' +
        '<div class="banner warn"><span>⚠️</span><span>No results endpoint is configured yet — connect one in <a href="#setup">Researcher tools</a> to start collecting responses.</span></div>' +
      '</div>';
    return;
  }

  root.innerHTML =
    '<div class="wrap-wide">' +
      '<div class="row between" style="margin-bottom:18px">' +
        '<div><span class="eyebrow">Researcher tools</span><h1 style="font-size:1.6rem">Results</h1></div>' +
        '<div class="row">' +
          (s.sheetUrl ? '<a href="'+esc(s.sheetUrl)+'" target="_blank" rel="noopener" class="btn">Open the Google Sheet ↗</a>' : '') +
          '<a href="#setup" class="btn">← Edit study</a>' +
        '</div>' +
      '</div>' +
      '<div id="results-body"><p class="hint">Loading results…</p></div>' +
    '</div>';

  var body = document.getElementById('results-body');

  fetch(s.endpointUrl + '?key=' + encodeURIComponent(s.resultsKey||''))
    .then(function(r){ return r.json(); })
    .then(function(data){
      if(!data || !data.ok){
        body.innerHTML = '<div class="banner warn"><span>⚠️</span><span>' +
          (data && data.error === 'unauthorized'
            ? 'The results key in Researcher tools doesn’t match RESULTS_KEY in your Apps Script. Fix it there, or open the Sheet directly.'
            : 'Could not read results from the endpoint. The Google Sheet is still the source of truth — open it directly.') +
          '</span></div>';
        return;
      }
      renderResultsBody(body, data.rows || []);
    })
    .catch(function(){
      body.innerHTML = '<div class="banner warn"><span>⚠️</span><span>Could not reach the results endpoint from here. If your Sheet link is set above, open it directly — your data is still being saved there.</span></div>';
    });
}

var resultsSubView = 'sessions'; // 'sessions' | 'breakdown' | 'journeys' | 'clickpaths' | 'analysis' — not persisted, resets on reload

function renderResultsBody(body, rows){
  var s = STATE.study;
  var stats = computeStatsFromRows(rows, s.tasks);

  var subTabsHtml =
    '<div class="subtabs">' +
      '<button class="subtab'+(resultsSubView==='sessions'?' active':'')+'" data-view="sessions">Sessions</button>' +
      '<button class="subtab'+(resultsSubView==='breakdown'?' active':'')+'" data-view="breakdown">Per-task breakdown</button>' +
      '<button class="subtab'+(resultsSubView==='journeys'?' active':'')+'" data-view="journeys">User journeys</button>' +
      '<button class="subtab'+(resultsSubView==='clickpaths'?' active':'')+'" data-view="clickpaths">Click paths</button>' +
      '<button class="subtab'+(resultsSubView==='analysis'?' active':'')+'" data-view="analysis">Analysis</button>' +
    '</div>';

  var mainContentHtml;
  if(rows.length === 0){
    mainContentHtml = '<div class="card"><p style="margin:0">No submissions yet. Share the link from Researcher tools — results will appear here automatically as people finish.</p></div>';
  } else if(resultsSubView === 'sessions'){
    mainContentHtml = sessionsHtml(rows, s.tasks);
  } else if(resultsSubView === 'journeys'){
    mainContentHtml = journeysHtml(rows, s.tasks);
  } else if(resultsSubView === 'clickpaths'){
    mainContentHtml = clickPathsHtml(rows, s.tasks, s.tree);
  } else if(resultsSubView === 'analysis'){
    mainContentHtml = analysisHtml(stats);
  } else {
    mainContentHtml = stats.perTask.map(taskBreakdownHtml).join('');
  }

  body.innerHTML =
    '<div class="stat-grid">' +
      '<div class="stat-card"><div class="num">'+stats.totalSessions+'</div><div class="lbl">Completed sessions</div></div>' +
      '<div class="stat-card"><div class="num">'+stats.overall.succPct+'%</div><div class="lbl">Overall success rate</div></div>' +
      '<div class="stat-card"><div class="num">'+stats.overall.directPct+'%</div><div class="lbl">Direct paths (no backtracking)</div></div>' +
      '<div class="stat-card"><div class="num">'+stats.avgTime+'s</div><div class="lbl">Avg. time per task</div></div>' +
    '</div>' +
    subTabsHtml +
    '<div id="results-subview">' + mainContentHtml + '</div>' +
    (rows.length ? '<div class="row" style="margin-top:16px"><button class="btn" id="export-csv-btn">Export all results (CSV)</button><button class="btn btn-ghost" id="refresh-results-btn">Refresh</button></div>' : '<div class="row" style="margin-top:18px"><button class="btn btn-ghost" id="refresh-results-btn">Refresh</button></div>');

  body.querySelectorAll('.subtab').forEach(function(b){
    b.onclick = function(){ resultsSubView = b.getAttribute('data-view'); renderResultsBody(body, rows); };
  });
  body.querySelectorAll('[data-sort-key]').forEach(function(th){
    th.onclick = function(){
      var key = th.getAttribute('data-sort-key');
      if(journeySort.key === key){ journeySort.dir = journeySort.dir === 'asc' ? 'desc' : 'asc'; }
      else { journeySort = { key: key, dir: 'asc' }; }
      renderResultsBody(body, rows);
    };
  });

  var refreshBtn = document.getElementById('refresh-results-btn');
  if(refreshBtn) refreshBtn.onclick = function(){ renderResults(document.getElementById('app')); };

  body.querySelectorAll('[data-delete-session]').forEach(function(btn){
    btn.onclick = function(){
      var sid = btn.getAttribute('data-delete-session');
      if(!window.confirm('Delete all responses for session '+sid+'? This cannot be undone.')) return;
      btn.disabled = true; btn.textContent = 'Deleting…';
      deleteSessionRows(s.endpointUrl, s.resultsKey, sid, function(ok){
        if(ok){ toast('Deleted.'); renderResults(document.getElementById('app')); }
        else { toast('Could not delete — check your connection and results key.'); btn.disabled = false; btn.textContent = 'Delete'; }
      });
    };
  });

  var saveNotesBtn = document.getElementById('save-analysis-notes-btn');
  if(saveNotesBtn) saveNotesBtn.onclick = function(){
    body.querySelectorAll('textarea[data-task-id]').forEach(function(ta){
      var taskId = ta.getAttribute('data-task-id');
      for(var i=0;i<s.tasks.length;i++){
        if(s.tasks[i].id === taskId){ s.tasks[i].analysisNote = ta.value; break; }
      }
    });
    downloadUpdatedSite();
    toast('Downloaded — upload this file to GitHub to publish the notes for your team.');
  };

  var exportBtn = document.getElementById('export-csv-btn');
  if(exportBtn) exportBtn.onclick = function(){
    var header = Object.keys(rows[0]);
    var csvRows = [header].concat(rows.map(function(r){ return header.map(function(h){ return r[h]; }); }));
    var csv = csvRows.map(function(row){ return row.map(function(v){ v = String(v==null?'':v).replace(/"/g,'""'); return /[",\n]/.test(v) ? '"'+v+'"' : v; }).join(','); }).join('\n');
    var blob = new Blob([csv], {type:'text/csv'});
    var url = URL.createObjectURL(blob);
    var a = document.createElement('a');
    a.href = url; a.download = 'tree-test-results.csv';
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(function(){ URL.revokeObjectURL(url); }, 4000);
  };
}
/* ================= render dispatcher ================= */
function render(){
  var root = document.getElementById('app');
  var r = route();
  if(r === 'setup'){
    if(!isUnlocked()) return renderGate(root, function(){ render(); }, 'Set up the study');
    return renderSetup(root);
  }
  if(r === 'results'){
    if(!isUnlocked()) return renderGate(root, function(){ render(); }, 'View results');
    return renderResults(root);
  }
  return renderIntro(root);
}

/* topbar */
function renderChrome(){
  var bar = document.createElement('div');
  bar.className = 'topbar';
  bar.innerHTML = '<div class="brand"><span class="mark">TT</span><span>' + esc(STATE.study.title) + '</span></div>' +
    '<div class="tabs">' +
      '<button class="tab" data-r="test">Take the test</button>' +
      '<button class="tab" data-r="setup">Researcher tools</button>' +
    '</div>';
  document.body.insertBefore(bar, document.getElementById('app'));
  function syncTabs(){
    var r = route();
    bar.querySelectorAll('.tab').forEach(function(b){
      b.classList.toggle('active', b.getAttribute('data-r') === r || (r==='results' && b.getAttribute('data-r')==='setup'));
    });
  }
  bar.querySelectorAll('.tab').forEach(function(b){ b.onclick = function(){ location.hash = '#'+b.getAttribute('data-r'); }; });
  window.addEventListener('hashchange', syncTabs);
  syncTabs();
}

document.body.classList.add('shell');
renderChrome();
render();

})();
</script>
